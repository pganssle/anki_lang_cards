[tgw]
api_base_url="https://my-tgw.example.com/v1/"
request_timeout=720

[models]
# Models prefixed "anthropic/" or "tgw/" use a dedicated backend; anything
# else goes through the `llm` library and whatever plugins it has installed.
default_model = "anthropic/claude-sonnet-5"
# Batching (half price, slower), prompt caching and structured output (the
# API enforces the response format, so responses always parse) are used
# wherever the backend supports them. Set one to true to require it -- you
# will be asked before a run goes ahead without it -- or to false to turn it
# off.
# batch = true
# prompt_caching = true
# structured_output = true

[anthropic]
# Optional: without it the SDK uses ANTHROPIC_API_KEY or an `ant auth login`
# profile.
api_key="sk-ant-...."
# Optional: low, medium, high, xhigh or max; unset uses the model default.
# effort = "medium"

[annotations]
dictionaries = [
    "input/dicts/sp-en-wik/sp-en-wik"
]

[sentences]
# Free-text description of the variety of Spanish the model should write in.
# It is interpolated into the prompt as "Write the Spanish in <dialect>."
# The default is "international Spanish".
dialect = "peninsular Spanish (the variety spoken in Spain)"
