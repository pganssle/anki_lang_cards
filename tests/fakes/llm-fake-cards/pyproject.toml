[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "llm-fake-cards"
version = "0.0.1"
description = "Deterministic fake llm model for anki_lang_cards end-to-end tests"
requires-python = ">=3.12"
dependencies = ["llm", "pydantic"]

[project.entry-points.llm]
fake_cards = "llm_fake_cards"
