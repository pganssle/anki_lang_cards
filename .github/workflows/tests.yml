name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The hunspell package builds against the system library's headers.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libhunspell-dev
      - run: python -m pip install tox
      - run: tox -e ${{ matrix.tox-env }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install tox
      - run: tox -e lint,format,type

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each target is a Dockerfile stage whose CMD runs one set of e2e
        # tests with no access to any external API:
        #   cards-e2e    card generation against the llm-fake-cards model
        #   anki-e2e     imports into real Anki, and AnkiConnect under Xvfb
        #   calibre-e2e  annotation extraction with a real calibre
        target: [cards-e2e, anki-e2e, calibre-e2e]
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anki-lang-cards-${{ matrix.target }}
          target: ${{ matrix.target }}
          # One cache scope per target, so that the jobs don't overwrite
          # each other's layers when they finish at the same time.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # The tests must pass without the network: the images have everything
      # they need, and nothing in them may reach a model API.
      - run: docker run --network none --rm anki-lang-cards-${{ matrix.target }}
