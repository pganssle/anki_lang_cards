name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The hunspell package builds against the system library's headers.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libhunspell-dev
      - run: python -m pip install tox
      - run: tox -e ${{ matrix.tox-env }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install tox
      - run: tox -e lint,format,type

  calibre-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anki-lang-cards-calibre-e2e
          target: calibre-e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --network none --rm anki-lang-cards-calibre-e2e
