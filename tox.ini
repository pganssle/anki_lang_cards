[tox]
isolated_build = True
envlist = py312, py313, lint, format, type, coverage
requires = 
    flit>=3.9.0

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest-cov
    coverage[toml]>=7.0.0
    .[books,testing,merge_ui]
setenv=
    COVERAGE_FILE={toxworkdir}/.coverage/.coverage.{envname}
commands =
    pytest {toxinidir} {posargs:tests} --basetemp={envtmpdir} --cov={envsitepackagesdir}/anki_lang_cards --cov-report=term-missing --cov-report=xml:{toxworkdir}/.coverage.{envname}.xml

[testenv:lint]
skip_install = True
deps =
    ruff>=0.11.11
commands =
    ruff check {toxinidir}/src {toxinidir}/tests

[testenv:format]
skip_install = True
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black {toxinidir}/src {toxinidir}/tests
    isort {toxinidir}/src {toxinidir}/tests

[testenv:type]
deps =
    mypy>=1.0.0
    lxml-stubs
    .[books,testing,merge_ui]
commands =
    mypy {toxinidir}/src {toxinidir}/tests
