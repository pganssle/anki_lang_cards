[tox]
isolated_build = True
envlist = py312, py313, lint, format, type

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest-cov
    coverage[toml]>=7.0.0
    .[books,testing,merge_ui]
setenv =
    COVERAGE_FILE={toxworkdir}/.coverage/.coverage.{envname}
commands =
    pytest {toxinidir} {posargs:tests -m "not e2e"} --basetemp={envtmpdir} --cov={envsitepackagesdir}/anki_lang_cards --cov-report=term-missing --cov-report=xml:{toxworkdir}/.coverage.{envname}.xml

[testenv:unit]
basepython = python3.13

[testenv:lint]
skip_install = True
deps =
    ruff>=0.11.11
commands =
    ruff check {toxinidir}/src {toxinidir}/tests

[testenv:format]
skip_install = True
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black --check {toxinidir}/src {toxinidir}/tests
    isort --check-only {toxinidir}/src {toxinidir}/tests

[testenv:type]
skip_install = True
deps =
    mypy>=1.0.0
    pytest>=9.0.0
commands =
    mypy {toxinidir}/tests/conftest.py {toxinidir}/tests/test_annotation_extractor.py

[testenv:e2e]
skip_install = True
deps =
allowlist_externals = docker
commands =
    docker build --network host --target calibre-e2e --tag anki-lang-cards-calibre-e2e {toxinidir}
    docker run --network none --rm anki-lang-cards-calibre-e2e
